# Build aplikacji macOS (GPU Tray) i firmware CYD (ESP32).
# Artefakty: GPUTray.app (podpis ad-hoc — w CI nie ma certyfikatu) i pliki .bin firmware.
name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos-app:
    name: Aplikacja macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Wersja Swift
        run: swift --version

      - name: Build + pakowanie GPUTray.app
        # build_app.sh: release build, Info.plist, codesign (bez certyfikatu → ad-hoc), kopia do dist/
        run: ./build_app.sh dist

      - name: Sprawdzenie pakietu
        run: |
          codesign --verify --strict dist/GPUTray.app
          plutil -lint dist/GPUTray.app/Contents/Info.plist
          file dist/GPUTray.app/Contents/MacOS/GPUTray

      - name: Archiwum (zachowuje podpis i atrybuty)
        run: ditto -c -k --keepParent dist/GPUTray.app GPUTray-app.zip

      - uses: actions/upload-artifact@v4
        with:
          name: GPUTray-app
          path: GPUTray-app.zip
          if-no-files-found: error

  firmware:
    name: Firmware CYD (ESP32)
    runs-on: ubuntu-latest
    env:
      # te same wersje co lokalnie (zweryfikowane na sprzęcie)
      ESP32_CORE: esp32:esp32@3.3.12
      ESP32_INDEX: https://espressif.github.io/arduino-esp32/package_esp32_index.json
      LIBS: LovyanGFX@1.2.28 ArduinoJson@7.4.3
      FQBN: esp32:esp32:esp32
    steps:
      - uses: actions/checkout@v4

      - uses: arduino/setup-arduino-cli@v2

      - name: Cache rdzenia i bibliotek Arduino
        uses: actions/cache@v4
        with:
          path: |
            ~/.arduino15
            ~/Arduino/libraries
          key: arduino-${{ runner.os }}-${{ env.ESP32_CORE }}-${{ env.LIBS }}

      - name: Rdzeń esp32 i biblioteki
        run: |
          arduino-cli config init --overwrite --additional-urls "$ESP32_INDEX"
          arduino-cli core update-index
          arduino-cli core install "$ESP32_CORE"
          arduino-cli lib install $LIBS
          arduino-cli core list
          arduino-cli lib list

      - name: Kompilacja
        run: |
          arduino-cli compile --fqbn "$FQBN" --warnings default \
            --output-dir build-fw esp32/gpu_cyd
          ls -l build-fw

      - uses: actions/upload-artifact@v4
        with:
          name: gpu_cyd-firmware
          path: |
            build-fw/*.bin
            build-fw/*.elf
          if-no-files-found: error
